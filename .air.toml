# https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/ioc"
  cmd = "go build -o ./tmp/ioc ./p1/cmd/ioc"
  delay = 300
  exclude_dir = ["tmp", "bin", "dist", "p1/demo", "p2", "p3", ".git"]
  include_ext = ["go"]
  include_dir = ["p1"]
  kill_delay = "2s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
